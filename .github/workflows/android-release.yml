name: Android APK yayinla

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Yayinlanacak surum (ornek: 1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_SERVER_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run config:remote
      - run: npm run android:prepare
      - name: Surum numarasini ayarla
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          IFS='.' read -r major minor patch <<< "$version"
          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ || ! "$patch" =~ ^[0-9]+$ ]]; then
            echo "Etiket vMAJOR.MINOR.PATCH biciminde olmali." >&2
            exit 1
          fi
          echo "APP_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((major * 1000000 + minor * 1000 + patch))" >> "$GITHUB_ENV"
      - name: Imzalama anahtarini hazirla
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
      - name: Imzali APK olustur
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ../release.keystore
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_APP_VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          ORG_GRADLE_PROJECT_APP_VERSION_CODE: ${{ env.APP_VERSION_CODE }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
